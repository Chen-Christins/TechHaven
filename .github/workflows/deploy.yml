name: Deploy and Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      branch:
        description: "要部署的分支（默认 master）"
        required: false
        default: master

permissions:
  contents: write

# 同一套线上目录只能同时执行一个发布，避免两个任务互相清理 release。
concurrency:
  group: techhaven-production-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Check build artifacts
        run: |
          test -d ./dist
          test "$(ls -A ./dist)"

      - name: Compute deploy paths
        id: deploy
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${{ github.ref_name }}"
          else
            BRANCH="${{ github.event.inputs.branch || 'master' }}"
            SHORT_SHA=$(git rev-parse --short HEAD)
            VERSION=$(echo "$BRANCH" | sed 's|/|-|g')-${SHORT_SHA}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "trigger=${{ github.event_name }}" >> $GITHUB_OUTPUT
          DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
          RELEASES_DIR="$(dirname "$DEPLOY_PATH")/releases"
          echo "releases_dir=$RELEASES_DIR" >> $GITHUB_OUTPUT
          echo "target=$RELEASES_DIR/$VERSION" >> $GITHUB_OUTPUT

      - name: Prepare versioned directory on remote
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            TARGET="${{ steps.deploy.outputs.target }}"
            if [ -z "$TARGET" ] || [ "$TARGET" = "/" ]; then
              echo "Target path is empty or root; aborting" >&2
              exit 1
            fi
            mkdir -p "$TARGET"

      - name: Deploy to versioned directory over SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: "./dist/*"
          strip_components: 1
          target: ${{ steps.deploy.outputs.target }}

      - name: Verify uploaded release
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            TARGET="${{ steps.deploy.outputs.target }}"
            if [ ! -d "$TARGET" ] || [ -z "$(find "$TARGET" -mindepth 1 -maxdepth 1 -print -quit)" ]; then
              echo "Release upload is missing or empty: $TARGET" >&2
              exit 1
            fi

      - name: Switch symlink, reload, and cleanup
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            RELEASES_DIR="${{ steps.deploy.outputs.releases_dir }}"
            VERSION="${{ steps.deploy.outputs.version }}"
            mkdir -p "$(dirname "$DEPLOY_PATH")/.deploy-lock"
            exec 9>"$(dirname "$DEPLOY_PATH")/.deploy-lock/production.lock"
            flock 9
            TARGET="$RELEASES_DIR/$VERSION"

            if [ ! -d "$TARGET" ] || [ -z "$(find "$TARGET" -mindepth 1 -maxdepth 1 -print -quit)" ]; then
              echo "Refusing to switch to missing or empty release: $TARGET" >&2
              exit 1
            fi

            # 首次部署：如果 DEPLOY_PATH 是真实目录（非软链接），清掉腾位置
            if [ -d "$DEPLOY_PATH" ] && [ ! -L "$DEPLOY_PATH" ]; then
              echo "⚠️  First deployment — removing real directory to create symlink..."
              rm -rf "$DEPLOY_PATH"
            fi

            # 用临时链接再 rename，避免 ln -sfn 在并发/异常时留下悬空链接。
            LINK_TMP="${DEPLOY_PATH}.new.$$"
            rm -f "$LINK_TMP"
            ln -s "$TARGET" "$LINK_TMP"
            mv -Tf "$LINK_TMP" "$DEPLOY_PATH"
            echo "🔗 Symlink switched → $VERSION"

            # 保留当前版本以及按修改时间最近的 5 个版本，不能按名称排序，
            # 否则 hotfix/feature 分支版本可能被排在 v* 版本之前而误删。
            cd "$RELEASES_DIR" 2>/dev/null || exit 0
            ACTIVE="$(basename "$(readlink -f "$DEPLOY_PATH")")"
            ALL_VERSIONS=$(find . -mindepth 1 -maxdepth 1 -type d -printf '%T@ %f\n' | sort -rn | sed 's/^[^ ]* //')
            KEEP=$(printf '%s\n' "$ALL_VERSIONS" | head -n 5)
            REMOVE=$(printf '%s\n' "$ALL_VERSIONS" | tail -n +6 | grep -Fxv "$ACTIVE" || true)
            if [ -n "$REMOVE" ]; then
              echo "$REMOVE" | xargs rm -rf
              echo "🧹 Cleaned old versions:"
              echo "$REMOVE" | sed 's/^/      /'
            fi

            echo "✅ Deployed: $VERSION"
            echo "📁 Active: $(readlink -f "$DEPLOY_PATH")"
            echo "📦 Kept versions:"
            ls -1d v* 2>/dev/null | sed 's/^/   /' || echo "   (none)"

      - name: Extract changelog for this version
        if: github.event_name == 'push'
        id: changelog
        run: |
          TAG="${{ github.ref_name }}"
          awk -v tag="$TAG" 'BEGIN{f=0} /^## /{if(f)exit} $0 ~ ("^## +\\[" tag "\\]"){f=1;next} f{print}' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "见 CHANGELOG.md" > release_notes.md
          fi

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release_notes.md
