name: CI Build Check

on:
  push:
    branches: ["master", "integration/agent-engine"]
  pull_request:
    branches: ["master", "integration/conversation"]

jobs:
  frontend:
    name: Frontend build & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # vitest4 + jsdom30 需要 Node >=22.12（undici/webidl.markAsUncloneable），
          # 与根 package.json engines 对齐
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check & build site
        run: npm run build

      - name: Run frontend unit tests
        run: npm test

      - name: Check bundle size budget
        run: node scripts/check-bundle-size.mjs

      - name: Check build artifacts
        run: |
          test -d ./dist
          test "$(ls -A ./dist)"

  services:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { path: techhaven-bff, name: "techhaven-bff build & test", check: build }
          - { path: techhaven-mcp, name: "techhaven-mcp typecheck & smoke", check: smoke }
          - { path: techhaven-agent-bridge, name: "techhaven-agent-bridge typecheck & smoke", check: smoke }
          - { path: techhaven-gateway, name: "techhaven-gateway typecheck & smoke", check: smoke }
    defaults:
      run:
        working-directory: services/${{ matrix.path }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: services/${{ matrix.path }}/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run ${{ matrix.check }}
